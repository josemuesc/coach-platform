spring:
  application:
    name: coach-platform
  datasource:
    # Supabase SESSION pooler (port 5432): works with Flyway locks and prepared statements.
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    # No hibernate.jdbc.time_zone: it shifts java.time.LocalTime (weekly availability) by the JVM/UTC offset.
    # Instants are stored as timestamptz (UTC) and LocalDate/LocalTime are plain calendar/wall-clock values anyway.
  flyway:
    enabled: true

# OpenAPI JSON + Swagger UI exist only when app.openapi.enabled=true (profile `dev`); in any other profile nothing is served.
springdoc:
  api-docs:
    enabled: ${app.openapi.enabled:false}
  swagger-ui:
    enabled: ${app.openapi.enabled:false}

app:
  registration:
    # Coach self-registration is CLOSED unless APP_REGISTRATION_OPEN=true. Open it only while creating the pilot coach(es), then close it.
    open: ${APP_REGISTRATION_OPEN:false}
  openapi:
    enabled: false
  # Origin allowed to call the API from a browser (the frontend). Same value used to build invitation and QR links.
  frontend-url: ${APP_FRONTEND_URL:http://localhost:5173}
  qr:
    # At least 32 bytes: signs the rotating event code the student scans (HMAC-SHA256). openssl rand -base64 48
    secret: ${APP_QR_SECRET}
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}
