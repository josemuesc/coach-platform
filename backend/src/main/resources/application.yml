spring:
  application:
    name: coach-platform
  datasource:
    # Supabase SESSION pooler (port 5432): works with Flyway locks and prepared statements.
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    # No hibernate.jdbc.time_zone: it shifts java.time.LocalTime (weekly availability) by the JVM/UTC offset.
    # Instants are stored as timestamptz (UTC) and LocalDate/LocalTime are plain calendar/wall-clock values anyway.
  flyway:
    enabled: true

app:
  qr:
    # At least 32 bytes: signs the rotating event code the student scans (HMAC-SHA256). openssl rand -base64 48
    secret: ${APP_QR_SECRET}
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}
